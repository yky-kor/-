<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청개구리 가위바위보 (반대로 지기 게임)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js 사운드 효과 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Firebase SDK 추가 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { font-family: 'Jua', sans-serif; }
        .frog-bg { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); }
    </style>
</head>
<body class="frog-bg min-h-screen text-white flex flex-col items-center justify-between p-4 select-none">

    <!-- 상단 헤더 -->
    <header class="w-full max-w-md flex justify-between items-center py-4 px-2">
        <div>
            <h1 class="text-3xl md:text-4xl font-bold drop-shadow-md" data-i18n="title">🐸 청개구리 가위바위보</h1>
            <p class="text-green-100 text-sm mt-1" data-i18n="subtitle">컴퓨터에게 져야만 점수를 얻는 반대로 게임!</p>
        </div>
        <!-- 언어 변경 버튼 -->
        <button onclick="toggleLanguage()" class="bg-white/20 hover:bg-white/30 text-white font-bold px-3 py-1.5 rounded-xl text-sm backdrop-blur-sm transition border border-white/30 shadow">
            🌐 <span id="lang-btn-text">EN</span>
        </button>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="w-full max-w-md bg-white text-gray-800 rounded-3xl shadow-2xl p-6 flex flex-col items-center relative overflow-hidden">

        <!-- 1. 모드 선택 화면 -->
        <div id="screen-menu" class="w-full flex flex-col items-center space-y-3 py-6">
            <h2 class="text-2xl font-bold text-green-700 mb-1" data-i18n="selectMode">모드를 선택하세요</h2>
            
            <button onclick="startGame('practice')" class="w-full py-3 bg-green-500 hover:bg-green-600 text-white font-bold text-base rounded-2xl shadow transition transform active:scale-95 text-left px-4">
                🎯 <span data-i18n="practiceMode">연습 모드</span>
                <span class="block text-xs font-normal text-green-100" data-i18n="practiceDesc">3초 제한 시간 안에서 10판 지기 연습!</span>
            </button>
            
            <button onclick="startGame('timeattack')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base rounded-2xl shadow transition transform active:scale-95 text-left px-4 relative">
                ⏱️ <span data-i18n="timeAttackMode">타임어택 모드</span> <span class="text-xs bg-amber-400 text-gray-900 px-2 py-0.5 rounded-full ml-1">NEW</span>
                <span class="block text-xs font-normal text-indigo-100" data-i18n="timeAttackDesc">시간 제한 없음! 10점을 가장 빠르게 달성하기</span>
            </button>

            <button onclick="startGame('timeattack_hard')" class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold text-base rounded-2xl shadow transition transform active:scale-95 text-left px-4 relative">
                ⚡ <span data-i18n="timeAttackHardMode">타임어택 하드 모드</span> <span class="text-xs bg-amber-400 text-gray-900 px-2 py-0.5 rounded-full ml-1">HARD</span>
                <span class="block text-xs font-normal text-purple-100" data-i18n="timeAttackHardDesc">버튼 위치가 매번 랜덤으로 섞이는 타임어택!</span>
            </button>
            
            <button onclick="startGame('infinite')" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-base rounded-2xl shadow transition transform active:scale-95 text-left px-4">
                ♾️ <span data-i18n="infiniteMode">무한 모드 (스피드)</span>
                <span class="block text-xs font-normal text-emerald-100" data-i18n="infiniteDesc">1초 안에 안 지면 끝! 최고기록 도전</span>
            </button>

            <button onclick="startGame('infinite_hard')" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold text-base rounded-2xl shadow transition transform active:scale-95 text-left px-4">
                🔥 <span data-i18n="infiniteHardMode">무한 하드 모드</span>
                <span class="block text-xs font-normal text-red-100" data-i18n="infiniteHardDesc">1초 제한 + 매 판 버튼 위치 셔플!</span>
            </button>
            
            <button onclick="showRanking()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold text-base rounded-2xl shadow transition transform active:scale-95">
                🏆 <span data-i18n="rankingBtn">명예의 랭킹</span>
            </button>
        </div>

      <!-- 2. 게임 플레이 화면 -->
        <div id="screen-game" class="w-full flex flex-col items-center hidden">
            <div class="w-full flex justify-between items-center mb-3">
                <button onclick="goHome()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-3 py-1.5 rounded-xl text-sm transition shadow-sm flex items-center space-x-1">
                    <span>🏠</span> <span data-i18n="backToMenu">메인으로</span>
                </button>
            </div>

            <div class="w-full flex justify-between items-center mb-3 text-sm font-semibold text-gray-500 bg-gray-100 px-4 py-2 rounded-xl">
                <span id="game-mode-label">모드</span>
                <span id="game-progress">진행도: 0/10</span>
                <span class="text-green-600 font-bold"><span data-i18n="scoreLabel">점수</span>: <span id="current-score">0</span></span>
            </div>

            <div id="timer-bar-container" class="w-full bg-gray-200 h-3 rounded-full overflow-hidden mb-4">
                <div id="timer-bar" class="bg-emerald-500 h-full w-full transition-all duration-100"></div>
            </div>

            <div id="stopwatch-display" class="hidden mb-2 text-indigo-600 font-bold text-lg">
                ⏱️ <span data-i18n="timeElapsed">경과 시간</span>: <span id="elapsed-time">0.0</span>s
            </div>

            <div class="text-center mb-3">
                <p class="text-xs text-gray-400 mb-1" data-i18n="comInstruction">컴퓨터가 낸 손 (이 손에 져야 합니다!)</p>
                <div id="com-hand" class="text-7xl animate-bounce">✊</div>
            </div>

            <div id="feedback-msg" class="h-8 text-xl font-bold mb-3 text-center"></div>

            <div id="rps-buttons-container" class="grid grid-cols-3 gap-3 w-full mb-2">
                <button onclick="playerChoice('scissor')" class="choice-btn py-4 bg-gray-50 hover:bg-green-50 border-2 border-gray-200 hover:border-green-500 rounded-2xl text-4xl shadow transition transform active:scale-95 flex flex-col items-center">
                    <span>✌️</span>
                    <span class="text-xs text-gray-500 mt-1" data-i18n="scissor">가위</span>
                </button>
                <button onclick="playerChoice('rock')" class="choice-btn py-4 bg-gray-50 hover:bg-green-50 border-2 border-gray-200 hover:border-green-500 rounded-2xl text-4xl shadow transition transform active:scale-95 flex flex-col items-center">
                    <span>✊</span>
                    <span class="text-xs text-gray-500 mt-1" data-i18n="rock">바위</span>
                </button>
                <button onclick="playerChoice('paper')" class="choice-btn py-4 bg-gray-50 hover:bg-green-50 border-2 border-gray-200 hover:border-green-500 rounded-2xl text-4xl shadow transition transform active:scale-95 flex flex-col items-center">
                    <span>🖐️</span>
                    <span class="text-xs text-gray-500 mt-1" data-i18n="paper">보</span>
                </button>
            </div>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="screen-result" class="w-full flex flex-col items-center hidden py-4">
            <h2 id="result-title" class="text-3xl font-bold text-gray-800 mb-2" data-i18n="gameOver">게임 종료!</h2>
            <p id="result-desc" class="text-gray-500 text-sm mb-6" data-i18n="wellDone">수고하셨습니다.</p>
            
            <div class="bg-green-50 border-2 border-green-200 rounded-2xl p-4 w-full text-center mb-6">
                <p id="result-label" class="text-sm text-green-700" data-i18n="earnedScore">획득 점수</p>
                <p id="final-score" class="text-5xl font-extrabold text-green-600 mt-1">0점</p>
            </div>

            <div id="name-input-container" class="w-full mb-4 hidden">
                <input type="text" id="player-name" placeholder="닉네임을 입력하세요 (최대 8자)" maxlength="8" class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl text-center font-bold text-lg mb-2 focus:outline-none focus:border-green-500">
                <button onclick="saveRanking()" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow" data-i18n="submitRanking">랭킹에 기록하기</button>
            </div>

            <button onclick="goHome()" class="w-full py-3 bg-gray-800 hover:bg-gray-900 text-white font-bold rounded-xl shadow" data-i18n="goHome">메인으로 돌아가기</button>
        </div>

        <!-- 4. 랭킹 화면 -->
        <div id="screen-ranking" class="w-full flex flex-col items-center hidden py-2">
            <div class="flex w-full mb-3 bg-gray-100 p-1 rounded-xl">
                <button onclick="switchRankingTab('infinite')" id="tab-infinite" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-green-700 shadow-sm" data-i18n="tabInfinite">무한모드</button>
                <button onclick="switchRankingTab('infinite_hard')" id="tab-infinite-hard" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-500" data-i18n="tabInfiniteHard">무한하드</button>
                <button onclick="switchRankingTab('timeattack')" id="tab-timeattack" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-500" data-i18n="tabTimeAttack">타임어택</button>
                <button onclick="switchRankingTab('timeattack_hard')" id="tab-timeattack-hard" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-500" data-i18n="tabTimeAttackHard">타임하드</button>
            </div>
            <div id="ranking-list" class="w-full max-h-52 overflow-y-auto divide-y divide-gray-100 mb-4 text-sm"></div>
            <button onclick="goHome()" class="w-full py-3 bg-gray-800 hover:bg-gray-900 text-white font-bold rounded-xl shadow" data-i18n="goHome">메인으로 돌아가기</button>
        </div>

    </main>

    <footer class="text-xs text-green-100 py-2">
        Made with Frog Power 🐸
    </footer>

    <!-- 자바스크립트 게임 로직 -->
    <script>
        const translations = {
            ko: {
                title: "🐸 청개구리 가위바위보",
                subtitle: "컴퓨터에게 져야만 점수를 얻는 반대로 게임!",
                selectMode: "모드를 선택하세요",
                practiceMode: "연습 모드",
                practiceDesc: "3초 제한 시간 안에서 10판 지기 연습!",
                timeAttackMode: "타임어택 모드",
                timeAttackDesc: "시간 제한 없음! 10점을 가장 빠르게 달성하기",
                timeAttackHardMode: "타임어택 하드 모드",
                timeAttackHardDesc: "버튼 위치가 매번 랜덤으로 섞이는 타임어택!",
                infiniteMode: "무한 모드 (스피드)",
                infiniteDesc: "1초 안에 안 지면 끝! 최고기록 도전",
                infiniteHardMode: "무한 하드 모드",
                infiniteHardDesc: "1초 제한 + 매 판 버튼 위치 셔플!",
                rankingBtn: "명예의 랭킹",
                scoreLabel: "점수",
                timeElapsed: "경과 시간",
                comInstruction: "컴퓨터가 낸 손 (이 손에 져야 합니다!)",
                scissor: "가위",
                rock: "바위",
                paper: "보",
                gameOver: "게임 종료!",
                wellDone: "수고하셨습니다.",
                earnedScore: "획득 점수",
                submitRanking: "랭킹에 기록하기",
                goHome: "메인으로 돌아가기",
                tabInfinite: "무한모드",
                tabInfiniteHard: "무한하드",
                tabTimeAttack: "타임어택",
                tabTimeAttackHard: "타임하드",
                loadingRanking: "랭킹을 불러오는 중...",
                noRanking: "아직 등록된 랭킹 기록이 없습니다.",
                modePractice: "연습 모드",
                modeTimeAttack: "타임어택 모드",
                modeTimeAttackHard: "타임어택 하드",
                modeInfinite: "무한 모드 (1초)",
                modeInfiniteHard: "무한 하드 모드",
                msgSuccess: "지기 성공! (+1점) 🐸",
                msgWin: "이겨버렸다! ❌",
                msgDraw: "비겼다! (점수 없음) ➖",
                msgTimeout: "시간 초과! ⏰",
                namePlaceholder: "닉네임 입력 (최대 8자)",
                anonymousName: "익명의 청개구리",
                alertZeroScore: "0점은 랭킹에 등록할 수 없습니다!"
            },
           en: {
                title: "🐸 Reverse RPS",
                subtitle: "The opposite game: Lose to the computer to score!",
                selectMode: "Select Mode",
                practiceMode: "Practice Mode",
                practiceDesc: "10 rounds of losing practice with 3s limit!",
                timeAttackMode: "Time Attack",
                timeAttackDesc: "No time limit! Reach 10 points ASAP",
                timeAttackHardMode: "Time Attack Hard",
                timeAttackHardDesc: "Random button shuffle Time Attack!",
                infiniteMode: "Infinite Mode (Speed)",
                infiniteDesc: "Don't fail within 1s! Beat your high score",
                infiniteHardMode: "Infinite Hard Mode",
                infiniteHardDesc: "1s limit + Button Shuffle!",
                rankingBtn: "Hall of Fame",
                scoreLabel: "Score",
                timeElapsed: "Elapsed Time",
                comInstruction: "Computer's hand (You must LOSE to this!)",
                scissor: "Scissor",
                rock: "Rock",
                paper: "Paper",
                gameOver: "Game Over!",
                wellDone: "Great job!",
                earnedScore: "Final Score",
                submitRanking: "Submit Score",
                goHome: "Back to Menu",
                backToMenu: "Back to Menu",
                tabInfinite: "Infinite",
                tabInfiniteHard: "Inf Hard",
                tabTimeAttack: "Time Attack",
                tabTimeAttackHard: "TA Hard",
                loadingRanking: "Loading rankings...",
                noRanking: "No ranking records yet.",
                modePractice: "Practice Mode",
                modeTimeAttack: "Time Attack Mode",
                modeTimeAttackHard: "Time Attack Hard",
                modeInfinite: "Infinite Mode (1s)",
                modeInfiniteHard: "Infinite Hard Mode",
                msgSuccess: "Successfully Lost! (+1pt) 🐸",
                msgWin: "You Won! (Oops) ❌",
                msgDraw: "Draw! (No pts) ➖",
                msgTimeout: "Time Out! ⏰",
                namePlaceholder: "Enter name (max 8 chars)",
                anonymousName: "Anonymous Frog",
                alertZeroScore: "0 points cannot be registered!"
            }
        };

        let currentLang = 'ko';

        function toggleLanguage() {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            document.getElementById('lang-btn-text').innerText = currentLang === 'ko' ? 'EN' : 'KR';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });

            const nameInput = document.getElementById('player-name');
            if(nameInput) {
                nameInput.placeholder = translations[currentLang].namePlaceholder;
            }

            if (gameState.isPlaying) {
                updateModeLabel();
            }
        }

        function updateModeLabel() {
            const labels = {
                'practice': translations[currentLang].modePractice,
                'timeattack': translations[currentLang].modeTimeAttack,
                'timeattack_hard': translations[currentLang].modeTimeAttackHard,
                'infinite': translations[currentLang].modeInfinite,
                'infinite_hard': translations[currentLang].modeInfiniteHard
            };
            document.getElementById('game-mode-label').innerText = labels[gameState.mode] || '';
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBLy1BrJ5LdgnXlElI2S_WeoqQzC5MSKUk",
            authDomain: "froggame-kor.firebaseapp.com",
            databaseURL: "https://froggame-kor-default-rtdb.firebaseio.com",
            projectId: "froggame-kor",
            storageBucket: "froggame-kor.firebasestorage.app",
            messagingSenderId: "83938472627",
            appId: "1:83938472627:web:b393e691486de2ac1b36c6",
            measurementId: "G-1SNF9LS2YJ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const hands = {
            'scissor': { emoji: '✌️', name: '가위', beats: 'paper', losesTo: 'rock' },
            'rock': { emoji: '✊', name: '바위', beats: 'scissor', losesTo: 'paper' },
            'paper': { emoji: '🖐️', name: '보', beats: 'rock', losesTo: 'scissor' }
        };
        const handKeys = ['scissor', 'rock', 'paper'];

        let gameState = {
            mode: 'practice',
            score: 0,
            round: 0,
            maxRounds: 10,
            isPlaying: false,
            comChoiceKey: '',
            timer: null,
            timeLeft: 100,
            startTime: 0,
            stopwatchTimer: null,
            elapsedSeconds: 0
        };

        const synth = new Tone.Synth().toDestination();
        function playSound(type) {
            try {
                Tone.start();
                if (type === 'success') synth.triggerAttackRelease("C5", "8n");
                else if (type === 'fail') synth.triggerAttackRelease("C3", "8n");
                else if (type === 'click') synth.triggerAttackRelease("G4", "32n");
            } catch(e) {}
        }

        function showScreen(screenId) {
            ['screen-menu', 'screen-game', 'screen-result', 'screen-ranking'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function startGame(mode) {
            playSound('click');
            gameState.mode = mode;
            gameState.score = 0;
            gameState.round = 0;
            gameState.isPlaying = true;
            gameState.startTime = Date.now();
            gameState.elapsedSeconds = 0;

            clearInterval(gameState.stopwatchTimer);

            const timerBarContainer = document.getElementById('timer-bar-container');
            const stopwatchDisplay = document.getElementById('stopwatch-display');

            updateModeLabel();

            if (mode === 'timeattack' || mode === 'timeattack_hard') {
                timerBarContainer.classList.add('hidden');
                stopwatchDisplay.classList.remove('hidden');
                
                gameState.stopwatchTimer = setInterval(() => {
                    gameState.elapsedSeconds = ((Date.now() - gameState.startTime) / 1000).toFixed(1);
                    document.getElementById('elapsed-time').innerText = gameState.elapsedSeconds;
                }, 100);
            } else {
                timerBarContainer.classList.remove('hidden');
                stopwatchDisplay.classList.add('hidden');
            }

            showScreen('screen-game');
            nextRound();
        }

        function nextRound() {
            if (!gameState.isPlaying) return;

            if (gameState.mode === 'practice') {
                gameState.round++;
                if (gameState.round > gameState.maxRounds) {
                    endGame();
                    return;
                }
                document.getElementById('game-progress').innerText = `${currentLang === 'ko' ? '진행도' : 'Progress'}: ${gameState.round}/${gameState.maxRounds}`;
            } else if (gameState.mode === 'timeattack' || gameState.mode === 'timeattack_hard') {
                document.getElementById('game-progress').innerText = `${currentLang === 'ko' ? '진행도' : 'Progress'}: ${gameState.score}/10`;
                if (gameState.score >= 10) {
                    endGame();
                    return;
                }
            } else {
                gameState.round++;
                document.getElementById('game-progress').innerText = `${currentLang === 'ko' ? '성공 콤보' : 'Streak'}: ${gameState.round - 1}`;
            }

            document.getElementById('current-score').innerText = gameState.score;
            document.getElementById('feedback-msg').innerText = '';
            setButtonsEnabled(true);

            const randomKey = handKeys[Math.floor(Math.random() * handKeys.length)];
            gameState.comChoiceKey = randomKey;
            document.getElementById('com-hand').innerText = hands[randomKey].emoji;

            // 하드 모드일 경우 버튼 위치 랜덤 섞기
            if (gameState.mode === 'infinite_hard' || gameState.mode === 'timeattack_hard') {
                randomizeButtons();
            }

            if (gameState.mode !== 'timeattack' && gameState.mode !== 'timeattack_hard') {
                startTimer();
            }
        }

        // 버튼 위치 무작위 셔플 함수
        function randomizeButtons() {
            const gridContainer = document.getElementById('rps-buttons-container');
            if (!gridContainer) return;
            const buttons = Array.from(gridContainer.children);
            for (let i = buttons.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                gridContainer.appendChild(buttons[j]);
            }
        }

        function startTimer() {
            clearInterval(gameState.timer);
            gameState.timeLeft = 100;
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.width = '100%';

            const startTime = Date.now();
            const duration = gameState.mode === 'practice' ? 3000 : 1000;

            gameState.timer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                gameState.timeLeft = Math.max(0, 100 - (elapsed / duration) * 100);
                timerBar.style.width = gameState.timeLeft + '%';

                if (elapsed >= duration) {
                    clearInterval(gameState.timer);
                    handleTimeout();
                }
            }, 20);
        }

        function handleTimeout() {
            if (!gameState.isPlaying) return;
            setButtonsEnabled(false);
            playSound('fail');
            document.getElementById('feedback-msg').innerHTML = `<span class="text-red-500">${translations[currentLang].msgTimeout}</span>`;

            if (gameState.mode === 'infinite' || gameState.mode === 'infinite_hard') {
                setTimeout(endGame, 1000);
            } else {
                setTimeout(nextRound, 1000);
            }
        }

        function playerChoice(choiceKey) {
            if (!gameState.isPlaying) return;
            clearInterval(gameState.timer);
            playSound('click');

            const comKey = gameState.comChoiceKey;
            const comHand = hands[comKey];
            const feedbackEl = document.getElementById('feedback-msg');

            const isUserLoss = (choiceKey === comHand.beats);    
            const isUserWin = (choiceKey === comHand.losesTo);   

            if (isUserLoss) {
                gameState.score += 1;
                playSound('success');
                feedbackEl.innerHTML = `<span class="text-green-600">${translations[currentLang].msgSuccess}</span>`;
                document.getElementById('current-score').innerText = gameState.score;

                // 타임어택 및 무한모드 모두 딜레이 없이 즉시 다음 판으로 진행
                if (gameState.mode === 'timeattack' || gameState.mode === 'timeattack_hard') {
                    if (gameState.score >= 10) {
                        setButtonsEnabled(false);
                        setTimeout(endGame, 300);
                    } else {
                        nextRound();
                    }
                    return;
                } else if (gameState.mode === 'infinite' || gameState.mode === 'infinite_hard') {
                    nextRound();
                    return;
                }
            } else if (isUserWin) {
                playSound('fail');
                feedbackEl.innerHTML = `<span class="text-red-500">${translations[currentLang].msgWin}</span>`;
                if (gameState.mode === 'infinite' || gameState.mode === 'infinite_hard') {
                    setButtonsEnabled(false);
                    gameState.isPlaying = false;
                    setTimeout(endGame, 1200);
                    return;
                }
            } else {
                playSound('fail');
                feedbackEl.innerHTML = `<span class="text-amber-500">${translations[currentLang].msgDraw}</span>`;
                if (gameState.mode === 'infinite' || gameState.mode === 'infinite_hard') {
                    setButtonsEnabled(false);
                    gameState.isPlaying = false;
                    setTimeout(endGame, 1200);
                    return;
                }
            }

            document.getElementById('current-score').innerText = gameState.score;

            if (gameState.mode !== 'timeattack' && gameState.mode !== 'timeattack_hard') {
                setButtonsEnabled(false);
                setTimeout(() => {
                    if (gameState.isPlaying) {
                        nextRound();
                    }
                }, 1000);
            }
        }

        function setButtonsEnabled(enabled) {
            const buttons = document.querySelectorAll('.choice-btn');
            buttons.forEach(btn => btn.disabled = !enabled);
        }

        function endGame() {
            gameState.isPlaying = false;
            clearInterval(gameState.timer);
            clearInterval(gameState.stopwatchTimer);
            showScreen('screen-result');

            const nameInputContainer = document.getElementById('name-input-container');
            const resultDesc = document.getElementById('result-desc');
            const resultLabel = document.getElementById('result-label');
            const finalScoreEl = document.getElementById('final-score');

            if (gameState.mode === 'infinite' || gameState.mode === 'infinite_hard') {
                resultLabel.innerText = currentLang === 'ko' ? '무한 모드 획득 점수' : 'Infinite Score';
                finalScoreEl.innerText = gameState.score + (currentLang === 'ko' ? '점' : ' pts');
                resultDesc.innerText = currentLang === 'ko' ? `무한 모드 기록: ${gameState.score}번 연속 성공!` : `Infinite Streak: ${gameState.score} in a row!`;
                nameInputContainer.classList.remove('hidden');
            } else if (gameState.mode === 'timeattack' || gameState.mode === 'timeattack_hard') {
                const totalTime = ((Date.now() - gameState.startTime) / 1000).toFixed(1);
                gameState.elapsedSeconds = totalTime;
                resultLabel.innerText = currentLang === 'ko' ? '10점 달성 소요 시간' : 'Time for 10 pts';
                finalScoreEl.innerText = totalTime + (currentLang === 'ko' ? '초' : 's');
                resultDesc.innerText = currentLang === 'ko' ? `타임어택 완료! 총 ${totalTime}초 소요` : `Time Attack Cleared in ${totalTime}s`;
                nameInputContainer.classList.remove('hidden');
            } else {
                resultLabel.innerText = currentLang === 'ko' ? '연습 모드 획득 점수' : 'Practice Score';
                finalScoreEl.innerText = gameState.score + (currentLang === 'ko' ? '점' : ' pts');
                resultDesc.innerText = currentLang === 'ko' ? `연습 모드 총 ${gameState.score}점을 획득했습니다.` : `Practice finished with ${gameState.score} points.`;
                nameInputContainer.classList.add('hidden');
            }
        }

        function saveRanking() {
            const nameInput = document.getElementById('player-name');
            const name = nameInput.value.trim() || translations[currentLang].anonymousName;

            let dbPath = '';
            if (gameState.mode === 'infinite') dbPath = 'rankings_infinite';
            else if (gameState.mode === 'infinite_hard') dbPath = 'rankings_infinite_hard';
            else if (gameState.mode === 'timeattack') dbPath = 'rankings_timeattack';
            else if (gameState.mode === 'timeattack_hard') dbPath = 'rankings_timeattack_hard';

            if (gameState.mode.includes('infinite')) {
                const score = gameState.score;
                if (score <= 0) {
                    alert(translations[currentLang].alertZeroScore);
                    return;
                }
                db.ref(dbPath).push().set({
                    name: name,
                    score: score,
                    date: new Date().toLocaleDateString()
                });
            } else {
                const timeTaken = parseFloat(gameState.elapsedSeconds);
                db.ref(dbPath).push().set({
                    name: name,
                    time: timeTaken,
                    date: new Date().toLocaleDateString()
                });
            }

            nameInput.value = '';
            showRanking(gameState.mode);
        }

        let currentRankingTab = 'infinite';
        function switchRankingTab(tab) {
            currentRankingTab = tab;
            const tabs = ['infinite', 'infinite_hard', 'timeattack', 'timeattack_hard'];
            
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t.replace('_', '-')}`);
                if (!btn) return;
                if (t === tab) {
                    btn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-green-700 shadow-sm";
                } else {
                    btn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-gray-500";
                }
            });
            renderRankingList();
        }

        function showRanking(tab = 'infinite') {
            showScreen('screen-ranking');
            switchRankingTab(tab);
        }

        function renderRankingList() {
            const rankingList = document.getElementById('ranking-list');
            const dbPaths = {
                'infinite': 'rankings_infinite',
                'infinite_hard': 'rankings_infinite_hard',
                'timeattack': 'rankings_timeattack',
                'timeattack_hard': 'rankings_timeattack_hard'
            };
            const dbPath = dbPaths[currentRankingTab];

            rankingList.innerHTML = `<p class="text-center text-gray-400 py-4">${translations[currentLang].loadingRanking}</p>`;

            db.ref(dbPath).once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    rankingList.innerHTML = `<p class="text-center text-gray-400 py-4">${translations[currentLang].noRanking}</p>`;
                    return;
                }

                let rankings = [];
                for (let id in data) {
                    rankings.push(data[id]);
                }

                if (currentRankingTab.includes('infinite')) {
                    rankings.sort((a, b) => b.score - a.score);
                    rankings = rankings.slice(0, 10);
                    rankingList.innerHTML = rankings.map((item, index) => `
                        <div class="flex justify-between items-center py-2 px-3 ${index === 0 ? 'bg-amber-50 font-bold text-amber-700 rounded-lg' : ''}">
                            <div class="flex items-center space-x-3">
                                <span class="w-6 text-center">${index + 1}${currentLang === 'ko' ? '위' : ''}</span>
                                <span class="truncate max-w-[120px]">${item.name}</span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="text-green-600 font-extrabold">${item.score}${currentLang === 'ko' ? '점' : ' pts'}</span>
                                <span class="text-xs text-gray-400">${item.date}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    rankings.sort((a, b) => a.time - b.time);
                    rankings = rankings.slice(0, 10);
                    rankingList.innerHTML = rankings.map((item, index) => `
                        <div class="flex justify-between items-center py-2 px-3 ${index === 0 ? 'bg-indigo-50 font-bold text-indigo-700 rounded-lg' : ''}">
                            <div class="flex items-center space-x-3">
                                <span class="w-6 text-center">${index + 1}${currentLang === 'ko' ? '위' : ''}</span>
                                <span class="truncate max-w-[120px]">${item.name}</span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="text-indigo-600 font-extrabold">${item.time}s</span>
                                <span class="text-xs text-gray-400">${item.date}</span>
                            </div>
                        </div>
                    `).join('');
                }
            });
        }

        function goHome() {
            playSound('click');
            showScreen('screen-menu');
        }
    </script>
</body>
</html>
